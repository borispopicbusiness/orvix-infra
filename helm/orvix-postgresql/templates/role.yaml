apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.name }}-patroni
  namespace: {{ .Values.namespace }}
rules:

  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - patch
      - update

  - apiGroups: [""]
    resources:
      - endpoints
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update

  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update