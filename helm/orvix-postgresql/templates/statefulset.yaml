apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}

spec:
  serviceName: {{ .Values.name }}
  replicas: {{ .Values.replicaCount }}

  podManagementPolicy: {{ .Values.pod.managementPolicy }}

  selector:
    matchLabels:
      cluster-name: {{ .Values.clusterName }}

  template:
    metadata:
      labels:
        cluster-name: {{ .Values.clusterName }}

    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      serviceAccountName: {{ .Values.name }}-patroni

      terminationGracePeriodSeconds: {{ .Values.pod.terminationGracePeriodSeconds }}

      containers:
        - name: postgres

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: postgresql
              containerPort: {{ .Values.service.port }}

            - name: patroni
              containerPort: {{ .Values.patroni.port }}

          env:

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: POSTGRES_PASSWORD

            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: REPLICATION_PASSWORD

            - name: PATRONI_KUBERNETES_USE_ENDPOINTS
              value: {{ .Values.patroni.kubernetes.useEndpoints | quote }}

            - name: PATRONI_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: PATRONI_KUBERNETES_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: PATRONI_KUBERNETES_PORTS
              value: {{ .Values.patroni.ports | toJson | quote }}

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            httpGet:
              path: /readiness
              port: {{ .Values.patroni.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          livenessProbe:
            httpGet:
              path: /liveness
              port: {{ .Values.patroni.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

  volumeClaimTemplates:

    - metadata:
        name: postgres-data

      spec:
        accessModes:
          {{- toYaml .Values.postgres.storage.accessModes | nindent 10 }}

        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}