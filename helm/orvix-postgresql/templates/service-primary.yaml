apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-primary
  namespace: {{ .Values.namespace }}
  labels:
    cluster-name: {{ .Values.clusterName }}
spec:
  selector:
    cluster-name: {{ .Values.clusterName }}
    role: primary

  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}