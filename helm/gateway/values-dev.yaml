namespace: dev

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 500Mi

hostAliases:
  - ip: "192.168.1.242"
    hostnames:
      - "keycloak-dev.keycloak.example.com"

image:
  repository: borispopicdev/orvix-gateway
  tag: 1.0.8-dev

# kubectl label nodes wn1 gateway-label=labeled
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: gateway-label
              operator: In
              values:
                - labeled

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: gateway.dev.k8s-svc.homelab
      paths:
        - path: /
          pathType: Prefix

config:
  data:
    server.port: "8080"
    spring.application.name: "gateway - dev"
    spring.security.oauth2.resourceserver.jwt.issuer-uri: http://keycloak-dev.keycloak.example.com/auth/realms/orvix-realm
    management.endpoints.web.exposure.include: "health,info,refresh"
    management.info.env.enabled: "true"
    info.app.name: "Orvix Gateway (dev) - from Config Map"
    info.app.version: "1.0.8-dev"
    info.app.description: "Orvix Gateway (dev) microservice's description is from the Config Map"
    downstream.uri: "http://192.168.1.10:8080"
    downstream.user.uri: "http://user-service:8080"
    spring.cloud.gateway.routes.0.id: "diagnostics"
    spring.cloud.gateway.routes.0.uri: "${downstream.uri}"
    spring.cloud.gateway.routes.0.predicates.0: "Path=/api/v1/diagnostics/gateway/services/all"
    spring.cloud.gateway.routes.1.id: "user-diagnostics"
    spring.cloud.gateway.routes.1.uri: "${downstream.user.uri}"
    spring.cloud.gateway.routes.1.predicates.0: "Path=/api/v1/user/**"

spring:
  profiles:
    active: dev

javaToolOptions: >-
  -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

livenessProbe:
  enabled: false

readinessProbe:
  enabled: false